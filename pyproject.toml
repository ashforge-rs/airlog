[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airlog"
version = "0.1.0"
description = "Audit logging library with pluggable backends"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["audit", "logging", "loguru", "json"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Logging",
]
dependencies = [
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.4",
]

[tool.uv]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/airlog"]

[tool.ruff]
src = ["src"]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "ANN", # flake8-annotations
    "S",   # flake8-bandit (security)
    "C90", # mccabe complexity
    "N",   # pep8-naming
    "RUF", # ruff-specific rules
    "T20", # flake8-print (no print statements)
]
ignore = [
    "ANN401", # Any is intentionally used for flexible sink/context kwargs
    "RUF002", # EN DASH used intentionally in docstrings for typographic clarity
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", # assert is idiomatic in pytest tests
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.isort]
known-first-party = ["airlog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--tb=short", "-v"]
